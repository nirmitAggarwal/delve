[package]
name = "delve"
version = "1.0.0"
edition = "2021"
description = "Delve — a powerful, adaptable Linux file manager"
license = "MIT"
rust-version = "1.80"

[[bin]]
name = "delve"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_10"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime_guess = "2"
trash = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
ureq = { version = "2", features = ["json"] }
libc = "0.2"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
